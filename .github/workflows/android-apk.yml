name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '*.md']

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # 64-bit ARM only (practically every Android phone since ~2017): about half the size of the
      # default APK, which bundles native code for four CPU types. The Play Store splits per device anyway.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cruxlog-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
